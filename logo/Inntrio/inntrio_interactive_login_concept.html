<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Inntrio · Login Experience Concept</title>
  <style>
    :root {color-scheme:dark; --night:#0b1420;--deep:#101f32;--navy:#192434;--navy2:#163451;--blue:#1d4779;--gold:#dfc184;--gold-light:#f4dca5;--gold-dim:#af8d52;--ivory:#f4f0e6;--muted:#a9bdd3;--border:rgba(176,211,244,.20);--shadow:rgba(0,7,17,.40);--panel:rgba(23,49,74,.73);}
    *{box-sizing:border-box}
    body {margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#f7f8fb;background:radial-gradient(ellipse 95% 110% at 100% 10%,#19416a 0%,transparent 52%),radial-gradient(ellipse 78% 80% at -8% 84%,#153456 0%,transparent 62%),linear-gradient(133deg,#081321 1%,#12263d 51%,#0b182a 100%);overflow-x:hidden}
    button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px}
    .scene {position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:.94}
    .scene svg {width:100%;height:100%;position:absolute;inset:0}
    .container{width:min(1280px,calc(100% - 60px));margin:auto;position:relative;z-index:1}
    .topnav {height:94px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid rgba(255,255,255,.07)}
    .brand {display:flex;align-items:center;gap:16px}
    .brand img{width:177px;height:auto;display:block}
    .brand small{color:#bdcfe2;letter-spacing:2.6px;font-size:10px;font-weight:650;border-left:1px solid rgba(244,220,165,.40);padding-left:16px;white-space:nowrap}
    .nav-side{display:flex;gap:16px;align-items:center;color:#b8cbdd;font-size:13px}
    .live{width:6px;height:6px;background:#5cc69a;border-radius:50%;box-shadow:0 0 10px rgba(92,198,154,.6)}
    .linkish{color:var(--gold-light);background:none;border:0;padding:7px;font-size:13px}
    .layout{min-height:calc(100vh - 94px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px 0 44px;}
    .masthead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:24px}
    .masthead .hero-logo{width:min(320px,70vw);display:block;filter:drop-shadow(0px 10px 20px rgba(0,0,0,.18))}
    .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:4.3px;font-size:10px;font-weight:750}
    h1{font-size:clamp(30px,3.2vw,48px);line-height:1.1;letter-spacing:-1.5px;margin:8px 0 5px;font-weight:760;text-align:center}
    .subtitle{font-size:15px;color:#bed0e3;line-height:1.6;text-align:center;margin:0}
    .surface{position:relative;isolation:isolate;background:linear-gradient(150deg,rgba(40,78,115,.53),rgba(14,31,50,.93) 45%,rgba(18,47,75,.83));border:1px solid rgba(195,220,243,.27);border-radius:25px;box-shadow:0 28px 75px rgba(0,5,18,.39),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
    .surface::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)}
    .surface::after{content:"";position:absolute;width:43%;height:2px;right:-4%;bottom:0;transform:rotate(-11deg);transform-origin:right;background:linear-gradient(90deg,transparent,rgba(238,195,122,.9),#fff0ba,transparent);box-shadow:0 0 20px 3px rgba(233,171,67,.31);pointer-events:none}
    .select-card {width:min(790px,100%);padding:31px 34px 29px}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .label-small{color:#a6bdcf;text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:750}
    .count-pill{color:#e9d5aa;background:rgba(209,169,101,.10);border:1px solid rgba(223,193,132,.26);border-radius:50px;font-size:12px;padding:7px 11px}
    .search-wrap{display:flex;align-items:center;gap:13px;padding:0 15px;border:1px solid var(--border);background:rgba(125,170,211,.08);border-radius:12px;height:49px;margin-bottom:16px}
    .search-wrap svg,.field svg{color:#a3bad4;flex:none}
    .search-wrap input,.field input{flex:1;min-width:0;background:transparent;border:0;color:#fff;outline:none;font-size:14px;width:100%}
    .search-wrap input::placeholder,.field input::placeholder{color:#92a9c0}
    .property-row{width:100%;background:linear-gradient(90deg,rgba(46,84,117,.4),rgba(16,36,57,.3));color:inherit;border:1px solid rgba(177,202,231,.23);border-radius:14px;padding:13px 15px;display:flex;align-items:center;text-align:left;gap:14px;margin-bottom:11px;min-height:80px;transition:background .2s,border-color .2s}
    .property-row.selected{border-color:#dfc184;background:linear-gradient(100deg,rgba(194,144,68,.12),rgba(32,67,99,.49));box-shadow:0 0 0 1px rgba(223,193,132,.14),inset 0 1px 0 rgba(255,255,255,.06)}
    .property-row:hover,.choice:hover{border-color:rgba(244,220,165,.7);background-color:rgba(54,91,126,.34)}
    .tile-ico,.choice-icon{flex:none;width:46px;height:46px;border:1px solid rgba(206,232,254,.14);background:rgba(195,225,255,.09);display:flex;align-items:center;justify-content:center;border-radius:11px;color:#ddbd7b}
    .property-title{display:block;font-size:16px;font-weight:720;line-height:1.35}.property-sub{display:block;color:#acbfd3;font-size:12px;margin-top:4px}
    .spacer{flex:1}
    .small-state{color:#90dbb9;border-radius:99px;border:1px solid rgba(89,189,146,.25);background:rgba(42,132,98,.2);font-size:11px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px}
    .small-state::before{content:"";height:6px;width:6px;border-radius:50%;background:#58cc92}
    .selected-circle{flex:none;height:25px;width:25px;border:1px solid #8199b4;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#152338}
    .property-row.selected .selected-circle{background:var(--gold);border-color:var(--gold)}
    .primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:12px;border:1px solid rgba(249,223,168,.69);min-height:52px;color:#11263e;font-weight:760;background:linear-gradient(165deg,#f7dca1 0%,#dec087 52%,#b98c50 100%);box-shadow:inset 0 1px 0 rgba(255,250,224,.8),0 8px 22px rgba(15,13,4,.15);transition:transform .15s,filter .15s}
    .primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
    .secondary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:12px;border:1px solid rgba(193,218,244,.44);min-height:52px;color:#edf4ff;font-weight:660;background:linear-gradient(180deg,rgba(44,83,121,.5),rgba(20,44,69,.85))}
    .primary:disabled{opacity:.4;cursor:not-allowed}
    .property-go{margin-top:21px}
    .below-note{font-size:12px;color:#8ca5ba;text-align:center;margin-top:19px}
    .selected-bar{width:min(870px,100%);display:flex;align-items:center;gap:14px;border:1px solid rgba(196,224,244,.25);background:rgba(66,111,155,.17);padding:10px 13px;border-radius:14px;margin:9px 0 25px}
    .selected-bar .tile-ico{width:44px;height:43px}.selected-bar .property-title{font-size:14px}.selected-bar .property-sub{font-size:11px}
    .change{background:none;color:#dec58e;border:0;font-size:12px;display:flex;gap:7px;align-items:center;white-space:nowrap;padding:6px 3px}
    .choices-wrap{width:min(925px,100%)}
    .choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .choice{width:100%;border-radius:17px;border:1px solid rgba(184,208,237,.25);background:linear-gradient(110deg,rgba(35,74,112,.62),rgba(11,28,47,.82));color:#f8fafc;padding:21px;display:flex;align-items:center;gap:18px;text-align:left;min-height:124px;position:relative;overflow:hidden;transition:background .2s,border-color .2s}
    .choice-feature{border:1px solid rgba(230,194,127,.64);box-shadow:inset 0 0 0 1px rgba(255,242,210,.06),0 0 28px rgba(225,175,95,.08)}
    .choice-feature::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(240,200,113,.08),transparent 51%)}
    .choice-icon{width:55px;height:55px;border-radius:15px}
    .choice-title{display:block;font-size:18px;font-weight:740;line-height:1.3}.choice-desc{font-size:12px;line-height:1.5;color:#c1d0e2;display:block;margin-top:5px}
    .choice .arrow{margin-left:auto;color:#edcea0}
    .login-card{width:min(560px,100%);padding:29px 34px 28px}
    .login-header{display:flex;align-items:center;gap:13px;padding-bottom:17px;border-bottom:1px solid rgba(217,231,249,.12);margin-bottom:21px}
    .login-header h2{font-size:27px;letter-spacing:-.8px;margin:0 0 3px;font-weight:760}.login-header p{margin:0;color:#a8bdd1;font-size:13px}
    .field-label{display:block;color:#dae4ef;font-size:11px;letter-spacing:1px;font-weight:760;margin:17px 0 8px;text-transform:uppercase}
    .field{width:100%;border:1px solid rgba(173,206,236,.29);border-radius:11px;display:flex;align-items:center;gap:12px;padding:0 15px;min-height:50px;background:rgba(93,138,178,.11)}
    .input-eye{border:0;background:none;color:#b3c5da;padding:5px}
    .options-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 21px;color:#bfcfe2;font-size:12px}
    .options-row label{display:flex;align-items:center;gap:9px}.options-row input{accent-color:#dfbf7f}.options-row a{color:#e7c985;text-decoration:none}
    .back{border:0;background:none;color:#b9cce0;margin:23px auto 0;display:flex;align-items:center;gap:7px;font-size:12px}
    .clock-card{width:min(1060px,100%);padding:31px;display:grid;grid-template-columns:minmax(0,1fr) 385px;grid-template-rows:1fr auto;gap:15px 30px;align-items:center}
    .clock-detail{padding:10px 2px;grid-column:1;grid-row:1}.clock-detail h2{font-size:clamp(28px,3vw,40px);letter-spacing:-1px;margin:0 0 9px}.clock-detail .copy{color:#b4c7dc;font-size:14px;line-height:1.6;margin:0 0 29px}
    .clock-detail .field{min-height:61px}
    .clock-meta{display:flex;align-items:center;gap:10px;color:#b5c6da;font-size:12px;margin-top:18px}
    .action-row{display:flex;gap:13px;margin-top:0;grid-column:1;grid-row:2}.action-row>*{flex:1}
    .keypad-panel{grid-column:2;grid-row:1 / span 2;background:linear-gradient(155deg,rgba(36,71,105,.66),rgba(10,28,45,.78));padding:16px;border:1px solid rgba(190,216,247,.28);border-radius:19px}
    .keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .key{background:linear-gradient(145deg,rgba(76,116,153,.35),rgba(30,57,83,.85));color:#eff5ff;border:1px solid rgba(179,204,234,.25);border-radius:12px;min-height:65px;font-size:27px;font-weight:650;box-shadow:inset 0 1px 0 rgba(255,255,255,.075)}
    .key:active{background:#365d80;transform:scale(.98)}.key.special{font-size:14px}
    .step-line{margin-top:25px;display:flex;justify-content:center;align-items:center;gap:15px}
    .step-label{color:#8ca7bf;font-size:11px}.step-bubble{border:1px solid rgba(229,196,136,.55);color:#ebce92;border-radius:50%;height:24px;width:24px;display:grid;place-items:center;font-size:11px}
    .step-bubble.active{color:#11263e;background:var(--gold)}.step-dash{width:34px;height:1px;background:rgba(223,193,132,.4)}
    .footnote{margin-top:14px;font-size:10px;color:#7393b0;text-align:center}
    .toast{position:fixed;z-index:99;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:all .22s;color:#182536;background:#f5dfb6;border:1px solid #fff5dd;padding:12px 20px;border-radius:12px;box-shadow:0 15px 44px rgba(0,0,0,.35);font-size:13px;font-weight:600;max-width:calc(100vw - 32px)}
    .toast.visible{transform:translate(-50%,0);opacity:1}
    .desktop-note{display:block}
    @media(max-width:730px){
      .container{width:min(100% - 28px,540px)}
      .topnav{height:69px}.brand img{width:128px}.brand small{display:none}.nav-side{font-size:10px}.nav-side span.status,.nav-side .live{display:none}
      .layout{min-height:calc(100svh - 69px);justify-content:flex-start;padding:25px 0 22px}
      .masthead{margin-bottom:16px;gap:7px}.masthead .hero-logo{width:230px}.eyebrow{font-size:8px;letter-spacing:2.5px}
      h1{font-size:clamp(27px,7vw,35px);margin:6px 0}.subtitle{font-size:13px}
      .surface{border-radius:19px}.select-card{padding:19px 16px}.property-row{padding:11px 12px;min-height:67px;gap:9px}.tile-ico{width:40px;height:40px}.property-title{font-size:14px}.small-state{display:none}.count-pill{font-size:10px}
      .selected-bar{margin:7px 0 19px;padding:9px;gap:9px}.change{font-size:11px}
      .choices-grid{grid-template-columns:1fr;gap:10px}.choice{min-height:78px;padding:13px;gap:12px}.choice-icon{width:43px;height:43px}.choice-title{font-size:15px}.choice-desc{font-size:11px;margin-top:2px}.choice .arrow{width:18px}
      .login-card{padding:21px 19px}.login-header h2{font-size:23px}.login-header{margin-bottom:15px;padding-bottom:13px}
      .clock-card{display:flex;flex-direction:column;gap:13px;padding:16px;align-items:stretch}
      .clock-detail{padding:0}.clock-detail h2{font-size:27px;margin:0 0 4px}.clock-detail .copy{margin:0 0 12px;font-size:12px}.field-label{margin:10px 0 5px}.clock-detail .field{min-height:45px}.clock-meta{display:none}
      .keypad-panel{padding:10px}.keypad-grid{gap:7px}.key{min-height:61px;border-radius:9px;font-size:24px}
      .action-row{margin-top:0;gap:8px}.action-row>*{min-height:49px;font-size:13px}
      .step-line{margin-top:18px}.clock-card ~ .step-line,.login-card ~ .step-line{display:none}.below-note{margin-top:16px}.footnote{margin-top:8px}
      .desktop-note{display:none}
    }
    @media(max-width:360px){.brand small{display:none}.container{width:calc(100% - 22px)}.key{min-height:53px}.clock-card{padding:13px}.action-row>*{font-size:12px}}
    @media(min-width:731px) and (max-height:800px){.layout{justify-content:flex-start;padding-top:21px}.masthead{margin-bottom:12px}.masthead .hero-logo{width:220px}h1{font-size:34px}.select-card{padding:22px}.choice{min-height:107px;padding:15px}.clock-card{padding:21px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>

<script>
function ico(name,size=21){return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"></use></svg>`}
let screen = 'property'; let chosen='Snoqualmie Inn'; let role='staff'; let kioskDigits=''; let loginUser=''; let loginPass=''; let remember=false;
const roles={staff:{title:'Staff sign-in',desc:'Your schedule, hours, and team updates.',icon:'users'},manager:{title:'Manager sign-in',desc:'Manage staff, scheduling, and operations.',icon:'shield'},developer:{title:'Developer sign-in',desc:'Access authorized systems and integrations.',icon:'code'}};
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('visible');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('visible'),3400)}

function propertyBanner(){return `<div class="selected-bar"><span class="tile-ico">${ico('hotel',25)}</span><span><b class="property-title">${chosen}</b><small class="property-sub">Snoqualmie, Washington</small></span><div class="spacer"></div><button class="change" type="button" onclick="go('property')">${ico('swap',17)} <span>Change property</span></button></div>`}
function property(){return `${brandHero()}<h1>Select a property</h1><p class="subtitle">Choose where you work to continue.</p><div style="height:25px"></div><section class="surface select-card"><div class="card-head"><div class="label-small">Available properties</div><span class="count-pill">1 property</span></div><div class="search-wrap">${ico('search',19)}<input id="property-search" aria-label="Search properties" placeholder="Search properties..." oninput="filterProp(this.value)"/></div><button class="property-row selected" id="property-choice" type="button" onclick="chosen='Snoqualmie Inn';render()"><span class="tile-ico">${ico('hotel',23)}</span><span><span class="property-title">Snoqualmie Inn</span><span class="property-sub">Snoqualmie, Washington</span></span><span class="spacer"></span><span class="small-state">Active</span><span class="selected-circle">${ico('check',16)}</span></button><p id="none" style="display:none;color:#b9cde0;font-size:13px">No matching properties.</p><button class="primary property-go" onclick="go('access')">Continue ${ico('arrow',19)}</button></section><div class="below-note">One workspace. Every department.</div>${steps()}`}
function filterProp(q){let show='snoqualmie inn'.includes(q.toLowerCase());document.getElementById('property-choice').style.display=show?'flex':'none';document.getElementById('none').style.display=show?'none':'block'}
function choice(name,sub,icon,click,feature=false){return `<button class="choice ${feature?'choice-feature':''}" onclick="${click}"><span class="choice-icon">${ico(icon,27)}</span><span><span class="choice-title">${name}</span><span class="choice-desc">${sub}</span></span>${ico('arrow',22)}</button>`}
function access(){return `${brandHero()}${propertyBanner()}<h1>How would you like to continue?</h1><p class="subtitle">Choose an access method for ${chosen}.</p><div style="height:26px"></div><div class="choices-wrap"><div class="choices-grid">${choice('Clock in / out','Use the familiar keypad to record your shift.','clock',"go('clock')",true)}${choice('Staff sign-in','Schedules, hours, and team updates.','users',"go('signin','staff')")}${choice('Manager sign-in','Staff management and hotel operations.','shield',"go('signin','manager')")}${choice('Developer sign-in','Authorized developer tools and integrations.','code',"go('signin','developer')")}</div></div>${steps()}`}
function login(){const r=roles[role];return `${propertyBanner()}<h1>${r.title}</h1><p class="subtitle">Sign in securely to continue at ${chosen}.</p><div style="height:22px"></div><form class="surface login-card" onsubmit="event.preventDefault();notify('Design demo: authentication is not connected.')"><div class="login-header"><div class="tile-ico">${ico(r.icon,25)}</div><div><h2>Welcome back</h2><p>${r.desc}</p></div></div><label class="field-label" for="username">Username or email</label><div class="field">${ico('user',19)}<input autocomplete="username" id="username" placeholder="Enter username or email" value="${escapeHTML(loginUser)}" oninput="loginUser=this.value" required/></div><label class="field-label" for="password">Password</label><div class="field">${ico('lock',19)}<input autocomplete="current-password" type="password" id="password" placeholder="Enter your password" value="${escapeHTML(loginPass)}" oninput="loginPass=this.value" required/><button type="button" class="input-eye" aria-label="Show password" onclick="togglePassword()">${ico('eye',20)}</button></div><div class="options-row"><label><input type="checkbox" ${remember?'checked':''} onchange="remember=this.checked"/>Remember me</label><a href="#" onclick="event.preventDefault();notify('Password recovery would open here.')">Forgot password?</a></div><button class="primary" type="submit">Sign in ${ico('arrow',19)}</button></form><button class="back" onclick="go('access')">${ico('left',16)} Back to access options</button>${steps()}`}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function togglePassword(){const el=document.getElementById('password');el.type=el.type==='password'?'text':'password'}
function digit(k){if(k==='clear')kioskDigits='';else if(k==='back')kioskDigits=kioskDigits.slice(0,-1);else if(kioskDigits.length<10)kioskDigits+=k;const el=document.getElementById('kiosk-id');if(el)el.value=kioskDigits}
function doClock(kind){if(!kioskDigits){notify('Enter a phone number or employee ID first.');return}notify(`Design demo: ${kind} for ${kioskDigits} was not submitted.`)}
function clock(){return `${propertyBanner()}<h1>Clock in / out</h1><p class="subtitle">A fast, familiar time clock for your shift.</p><div style="height:20px"></div><section class="surface clock-card"><div class="clock-detail"><h2>Time clock</h2><p class="copy">Enter your 10-digit phone number or 4–6 digit employee ID, then choose an action.</p><label class="field-label" for="kiosk-id">Phone number / employee ID</label><div class="field">${ico('user',22)}<input inputmode="none" id="kiosk-id" aria-label="Phone number or employee ID" maxlength="10" autocomplete="off" placeholder="10-digit phone · 4–6 digit ID" value="${kioskDigits}" oninput="kioskDigits=this.value.replace(/\\D/g,'').slice(0,10);this.value=kioskDigits"/></div><div class="clock-meta">${ico('clock',16)} <span id="clock-local">Pacific Time</span><span style="margin:0 5px;color:#556a80">•</span>${ico('hotel',16)} Snoqualmie Inn</div></div><div class="keypad-panel"><div class="keypad-grid">${['1','2','3','4','5','6','7','8','9','Clear','0','Back'].map(k=>`<button type="button" class="key ${k==='Clear'||k==='Back'?'special':''}" onclick="digit('${k==='Clear'?'clear':k==='Back'?'back':k}')" aria-label="${k}">${k==='Back'?ico('backspace',24):k}</button>`).join('')}</div></div><div class="action-row"><button class="primary" onclick="doClock('clock-in')">${ico('login',19)} Clock in</button><button class="secondary" onclick="doClock('clock-out')">${ico('logout',19)} Clock out</button></div></section><button class="back" onclick="go('access')">${ico('left',16)} Back to access options</button>${steps()}`}
function updateTime(){const dt=new Date();const s=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'}).format(dt);const node=document.getElementById('datetime');if(node)node.textContent=s+' PT';const n2=document.getElementById('clock-local');if(n2)n2.textContent=s+' PT'}
function render(){document.getElementById('main').innerHTML=screen==='property'?property():screen==='access'?access():screen==='signin'?login():clock();document.getElementById('nav-back').style.visibility=screen==='property'?'hidden':'visible';updateTime()}
window.addEventListener('keydown',e=>{if(screen!=='clock'||document.activeElement?.tagName==='INPUT')return;if(e.key>='0'&&e.key<='9'){digit(e.key);e.preventDefault()}else if(e.key==='Backspace'){digit('back');e.preventDefault()}})
window.addEventListener('DOMContentLoaded',()=>{render();setInterval(updateTime,30000);const params=new URLSearchParams(location.search);if(params.get('screen')==='access')go('access');if(params.get('screen')==='signin')go('signin',params.get('role')||'staff');if(params.get('screen')==='clock')go('clock')});
</script>
